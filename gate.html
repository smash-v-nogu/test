<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1215">
<title>ТЕСТ · Смэш мне в ногу</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1215'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='900' font-size='26' text-anchor='middle' fill='%23e5484d'%3ET%3C/text%3E%3C/svg%3E">
<style>
:root { --hall: #0b1215; --ink: #e8efe9; --muted: #8ba49a; --edge: rgba(232, 239, 233, 0.14); --lamp: #ffd78a; --red: #e5484d; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--hall); color: var(--ink); font: 16px/1.4 "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif; }
body { display: grid; place-items: center; padding: 16px; }
.card { width: min(360px, 100%); display: grid; gap: 14px; padding: 28px 24px 22px; border: 1px solid var(--edge); border-radius: 18px; background: rgba(9, 15, 17, 0.9); text-align: center; }
.card[hidden] { display: none; }
.tag { justify-self: center; padding: 4px 9px 3px; border-radius: 6px; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 0.16em; }
h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
p { margin: 0; color: var(--muted); font-size: 14px; }
.field { position: relative; }
input { width: 100%; padding: 13px 50px; border-radius: 12px; border: 1px solid var(--edge); background: #0e1719; color: var(--ink); font-size: 16px; font-weight: 500; font-family: inherit; text-align: center; }
input:focus { outline: 2px solid var(--lamp); outline-offset: 1px; }
input::-ms-reveal, input::-ms-clear { display: none; } /* у Edge свой глазик — второй не нужен */
button { padding: 13px 14px; border: 0; border-radius: 12px; background: var(--lamp); color: #14100a; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: progress; }
.eye { position: absolute; top: 50%; right: 5px; transform: translateY(-50%); width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border-radius: 9px; background: none; color: var(--muted); }
.eye:hover { color: var(--ink); }
.eye:focus-visible { outline: 2px solid var(--lamp); }
.eye[aria-pressed="true"] { color: var(--lamp); }
.eye svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.eye[aria-pressed="true"] .slash { display: none; }
.err { min-height: 1.4em; color: #ff8a80; font-size: 14px; }
.from { font-size: 11px; color: #5f7670; }
</style>
</head>
<body>
<form class="card" id="gate" hidden autocomplete="off">
  <span class="tag">ТЕСТ</span>
  <h1>Смэш мне в ногу</h1>
  <p>Тестовая сборка для своих. Результаты не попадают в общую таблицу.</p>
  <div class="field">
    <input id="pass" type="password" placeholder="Пароль" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
    <button class="eye" id="eye" type="button" aria-label="Показать пароль" aria-pressed="false" title="Показать пароль">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
    </button>
  </div>
  <button id="go" type="submit">Войти</button>
  <div class="err" id="err" role="alert"></div>
  <div class="from" id="from">%FROM%</div>
</form>
<script id="pack" type="text/plain" data-salt="%SALT%" data-iv="%IV%" data-iter="%ITER%">%DATA%</script>
<script>
(() => { // всё внутри: после document.open глобальная область остаётся той же, игра не должна споткнуться о наши имена
  const $ = id => document.getElementById(id);
  const KEY = 'bdm-test-key';
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const norm = s => s.normalize('NFC').trim().toLowerCase(); // так же, как в build.mjs
  let pk; // шифр страницы: id сборки (iv), соль, iv, итерации, данные
  const load = el => { pk = { id: el.dataset.iv, salt: u8(el.dataset.salt), iv: u8(el.dataset.iv), iter: +el.dataset.iter, data: u8(el.textContent.trim()) }; };
  load($('pack'));
  const store = { get() { try { return localStorage.getItem(KEY); } catch (_) { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch (_) {} }, del() { try { localStorage.removeItem(KEY); } catch (_) {} } };

  async function derive(pass) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: pk.salt, iterations: pk.iter }, base, 256));
  }
  async function decrypt(raw) { // null — ключ не подошёл
    try {
      const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
      return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: pk.iv }, key, pk.data));
    } catch (_) { return null; }
  }
  // Страница могла устареть: вкладку открыли до пересборки или браузер взял её из кэша (GitHub Pages разрешает 10 минут).
  // Старый шифр с тем же паролем молча открыл бы прошлую сборку, с другим — «Не тот пароль». Поэтому перед расшифровкой
  // сверяемся с build.txt (id свежей сборки, несколько байт, мимо кэша); не совпал — берём страницу заново и подменяем шифр
  async function fresh() {
    try {
      const v = (await (await fetch('build.txt?' + Date.now(), { cache: 'no-store' })).text()).trim();
      if (!/^[A-Za-z0-9+/]{16}$/.test(v) || v === pk.id) return false;
      const r = await fetch(location.pathname + '?fresh=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return false;
      const doc = new DOMParser().parseFromString(await r.text(), 'text/html'), el = doc.getElementById('pack');
      if (!el || el.dataset.iv === pk.id) return false;
      load(el);
      const f = doc.getElementById('from'); if (f) $('from').textContent = f.textContent;
      return true;
    } catch (_) { return false; }
  }
  // Айфон: пока открыта клавиатура (пароль, код комнаты, имя), Safari сдвигает страницу к полю и после неё может не вернуть.
  // Кнопки рисуются на месте, а касания засчитываются со сдвигом: жмёшь реакцию — уходит соседняя, стрелки «не нажимаются»
  // (гостья на айфоне, 20.11). Вшиваем в игру возврат страницы: так починка выходит без пересборки шифра. В игре она же —
  // с wip/slowmo 20.11, после пересборки обе живут рядом и не мешают друг другу
  const FIX = `<script>(() => {
  const typing = () => { const a = document.activeElement; return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'); };
  const reset = () => {
    if (typing()) return;
    if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
    for (const el of [document.documentElement, document.body]) if (el && (el.scrollTop || el.scrollLeft)) { el.scrollTop = 0; el.scrollLeft = 0; }
  };
  const later = () => { setTimeout(reset, 60); setTimeout(reset, 400); }; // клавиатура уезжает с анимацией — дожимаем после неё
  document.addEventListener('focusout', later);
  if (window.visualViewport) visualViewport.addEventListener('resize', later);
  window.addEventListener('orientationchange', later);
  later();
})();<\/script>`;
  function show(html) { document.open(); document.write(html.replace(/<head(\s[^>]*)?>/i, m => m + FIX)); document.close(); }
  function form(msg) { $('gate').hidden = false; $('err').textContent = msg || ''; $('pass').focus(); }
  function busy(on) { $('go').disabled = on; $('go').textContent = on ? 'Открываю…' : 'Войти'; if (on) $('err').textContent = ''; }

  // Глазик: показать / скрыть вводимый пароль. Фокус остаётся в поле, клавиатура телефона не прыгает
  $('eye').addEventListener('mousedown', e => e.preventDefault());
  $('eye').addEventListener('click', () => {
    const p = $('pass'), on = p.type === 'password';
    p.type = on ? 'text' : 'password';
    $('eye').setAttribute('aria-pressed', String(on));
    $('eye').title = on ? 'Скрыть пароль' : 'Показать пароль';
    p.focus();
  });

  if (!window.crypto || !crypto.subtle) { form('Браузер не умеет расшифровку: открой страницу по https в свежем браузере'); $('go').disabled = true; return; }

  $('gate').addEventListener('submit', async e => {
    e.preventDefault();
    const pass = norm($('pass').value); if (!pass) return;
    busy(true);
    let raw, html = null;
    try {
      await fresh();
      html = await decrypt(raw = await derive(pass));
    } catch (_) {}
    if (html === null) { busy(false); form('Не тот пароль'); $('pass').select(); return; }
    store.set(btoa(String.fromCharCode(...raw))); // в следующий раз — без пароля
    show(html);
  });

  // Уже входил в этом браузере: ключ сохранён, пароль не спрашиваем. Сборку пересобрали с другим паролем — ключ не подойдёт, спросим снова
  const saved = store.get();
  if (!saved) { form(); fresh(); return; } // подвал сразу покажет свежую сборку
  (async () => {
    let raw = null, html = null;
    try { raw = u8(saved); } catch (_) {}
    if (raw) { await fresh(); html = await decrypt(raw); }
    if (html !== null) return show(html);
    store.del(); form();
  })();
})();
</script>
</body>
</html>
